<!DOCTYPE html>

<html>
    <style> /* CSS */

        * {
            box-sizing: border-box;
            
        }

        a {
            color: black;
        }

        .spawnBlackScreenFade { /* black screen animation */
            transition: all 3s;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0%;
            left: 0%;
            z-index: 2;
            
            
        }

        .hide { /* hide element */
            content-visibility: hidden;
            opacity: 0%;
        }

        .show { /* show element */
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0%;
            left: 0%;
            
        }

        body { 
            background-color: black;
        }

        .up {   /* movement button */
            opacity: 00%;
            background-color: black;
            width: 10%;
            height: 10%;
            top: 1%;
            left: 49%;
            position: absolute;
        }

        .left {   /* movement button */
            opacity: 0%;
            background-color: black;
            width: 10%;
            height: 10%;
            top: 47%;
            left: 0.1%;
            position: absolute;
        }

        .right {   /* movement button */
            opacity: 0%;
            background-color: black;
            width: 10%;
            height: 10%;
            top: 47%;
            right: 0.1%;
            position: absolute;
        }

        .down {   /* movement button */
            opacity: 0%;
            background-color: black;
            width: 10%;
            height: 10%;
            bottom: 0%;
            left: 49%;
            position: absolute;
        }

        .monsterMovingMsg {   /* game messages */
            background-color: rgba(255, 0, 0, 0.466);
            color: black;
            z-index: 2;
            position: absolute;
            top: 50%;
            left: 48%;
            opacity: 100%;
        }

        .loseMonsterImg { /* lose screen */
            position: absolute;
            top: 15%;
            left: 35%;
            width: 30%;
            height: 40%;
            z-index: 5;
        
        }

        .winScreenImg { /* win screen */
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0%;
            left: 0%;
            z-index: 5;
        
        }

        .restartButton { /* restart game button after win or lose */
            position: absolute;
            top: 64%;
            left: 42%;
            width: 15%;
            height: 5%;
            background-color: red;
            color: black;
            border: solid 3px rgb(41, 39, 39);
            z-index: 6;
        }

        .keyObjectLocationA { /* key item */
            position: absolute;
            z-index: 2;
            width: 20%;
            height: 30%;
            top: 42%;
            left: 40%;
        }

        .doorOpenButton {
            position: absolute;
            width: 10%;
            height: 20%;
            top: 34%;
            left: 41%;
            color: black;
            opacity: 0%;

        }

        #doorLockedMsg {
            width: 300px;
            height: 50px;
        }

        
    </style>

                if (gameSystemVariables.playerLocation == "lowerMiddle" && gameSystemVariables.canMove == true) { //middle gate to top right//

                    gameSystemVariables.playerLocation = 'lowerRight';
                    console.log(gameSystemVariables.playerLocation);
                    roomImgs.querySelector('#lowerMiddle').className = 'hide';
                    roomImgs.querySelector('#lowerRight').className = 'show';
                    gameSystemVariables.canMove = false;
                    monsterTurn();

                } 

                if (gameSystemVariables.playerLocation == "lowerLeft" && gameSystemVariables.canMove == true) { //lower left to lower middle//

                    gameSystemVariables.playerLocation = 'lowerMiddle';
                    console.log(gameSystemVariables.playerLocation);
                    roomImgs.querySelector('#lowerLeft').className = 'hide';
                    roomImgs.querySelector('#lowerMiddle').className = 'show';
                    gameSystemVariables.canMove = false;
                    gameAssets.keyObjectA.className = 'hide';
                    monsterTurn();

                }

                if (gameSystemVariables.playerLocation == "upperMiddleGate" && gameSystemVariables.canMove == true) { //middle gate to top right//

                    gameSystemVariables.playerLocation = 'topRight';
                    console.log(gameSystemVariables.playerLocation);
                    roomImgs.querySelector('#middleGate').className = 'hide';
                    roomImgs.querySelector('#topRight').className = 'show';
                    gameSystemVariables.canMove = false;
                    monsterTurn();

                } 

                if (gameSystemVariables.playerLocation == "topLeft" && gameSystemVariables.canMove == true) { //middle gate to top right//

                    gameSystemVariables.playerLocation = 'upperMiddleGate';
                    console.log(gameSystemVariables.playerLocation);
                    roomImgs.querySelector('#topLeft').className = 'hide';
                    roomImgs.querySelector('#middleGate').className = 'show';
                    gameSystemVariables.canMove = false;
                    monsterTurn();

                } 

        }

        function spawnBlackScreen() { //blackScreen transition//
            const timeOut = setTimeout(() => {
                let opacityPropertyValue = 0;
                let styling = `opacity: ${opacityPropertyValue}%;`;
                gameAssets.spawnBlackScreen.style = styling;

            },120)

            const timeOut2 = setTimeout(() => { //remove blackScreen, spawn in starting room.//
                gameAssets.spawnBlackScreen.remove();
               
            },1300)
        }

        function lose() { // lose screen //
            const loseScreen = document.querySelector('#loseScreenMonsterImg');
            const restartButton = document.querySelector('#restartGameButton');
            const footstep = document.querySelector('#sounds').querySelector('#monsterIsFar');

            footstep.pause();
            canMove = false;
            loseScreen.className = 'loseMonsterImg';

            const timeOut4 = setTimeout(() => {
                 restartButton.className = 'restartButton';
                 restartButton.addEventListener('click', function() {
                    location.assign('https://warriorwolf.github.io/game.html');});
            }, 5000)
            
            restartButton.className = 'hide';
           
        }

        function win() { // win screen //
            const winScreen = document.querySelector('#winImage');
            const restartButton = document.querySelector('#restartGameButton');
            const winMusic = gameAssets.sounds.querySelector('#win_music');
            winMusic.play();
            gameSystemVariables.canMove = false;
            winScreen.className = 'winScreenImg';

            const timeOut4 = setTimeout(() => {
                 restartButton.className = '';
                 restartButton.innerHTML = '<a href="game.html">Attempt again? </a>';
                 restartButton.style = 'position: absolute; bottom: 1%; left: 48%; width: 8%; height: 4%; background-color: red; color: black; border: solid 3px rgb(41, 39, 39); z-index: 6; opacity: 80%;';
            }, 5000)
            
            roomImgs.querySelector('#farRight').className = 'hide';
            roomImgs.querySelector('#middleGate').className = 'hide';
            roomImgs.querySelector('#farLeft').className = 'hide';
            roomImgs.querySelector('#topLeft').className = 'hide';
            roomImgs.querySelector('#topRight').className = 'hide';
            roomImgs.querySelector('#lowerMiddle').className = 'hide';
            roomImgs.querySelector('#lowerLeft').className = 'hide';
            roomImgs.querySelector('#lowerRight').className = 'hide';
            roomImgs.querySelector('#middleStartingRoom').className = 'hide';
            restartButton.className = 'hide';
           
        }

        function openDoor() { // open door function
            const doorOpenButton = document.querySelector('#doorOpenButton');
            const monsterMsg = document.querySelector('#monsterMoveMsg');
            const lockedMsg = document.querySelector('#doorLockedMsg');
            
            if (gameSystemVariables.playerHasKey == true && monsterMsg.className == 'hide') {
                doorOpenButton.className = 'hide';
                win()
            }

            if (gameSystemVariables.playerHasKey == false && monsterMsg.className == 'hide') {
                lockedMsg.className = 'show';
            }
        }

        function keyPickUp() { // key pick up function
            const monsterMsg = document.querySelector('#monsterMoveMsg')
            
            if (monsterMsg.className == 'hide') {
                gameAssets.keyObjectA.className = 'hide';
                gameSystemVariables.playerHasKey = true;
            }
        }

        spawnBlackScreen() //player camera spawns here//

    </script>
    

</html>
